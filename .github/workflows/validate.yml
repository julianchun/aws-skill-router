name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SKILL.md frontmatter
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          # Agent Skills specification: https://agentskills.io/specification
          import pathlib
          import re
          import sys
          import yaml

          skill_files = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skill_files:
              print("Error: no skills/*/SKILL.md files found", file=sys.stderr)
              sys.exit(1)

          name_re = re.compile(r"^[a-z0-9]+(-[a-z0-9]+)*$")

          for path in skill_files:
              text = path.read_text(encoding="utf-8")
              match = re.match(r"^---\r?\n(.*?)\r?\n---(?:\r?\n|$)", text, re.DOTALL)
              if not match:
                  print(f"Error: {path} does not start with a YAML frontmatter block", file=sys.stderr)
                  sys.exit(1)

              data = yaml.safe_load(match.group(1))
              if not isinstance(data, dict):
                  print(f"Error: {path} frontmatter must parse to a YAML mapping", file=sys.stderr)
                  sys.exit(1)

              extra = set(data) - {"name", "description", "license", "allowed-tools", "metadata", "compatibility"}
              if extra:
                  print(f"Error: {path} has non-spec frontmatter field(s): {', '.join(sorted(extra))}", file=sys.stderr)
                  sys.exit(1)

              tools = data.get("allowed-tools")
              if tools is not None and not isinstance(tools, str):
                  print(f"Error: {path} 'allowed-tools' must be a string, not a list", file=sys.stderr)
                  sys.exit(1)

              name = data.get("name")
              description = data.get("description")

              if not isinstance(name, str) or not name:
                  print(f"Error: {path} frontmatter 'name' must be a non-empty string", file=sys.stderr)
                  sys.exit(1)

              if len(name) > 64 or not name_re.fullmatch(name):
                  print(f"Error: {path} frontmatter 'name' ({name!r}) violates spec rules", file=sys.stderr)
                  sys.exit(1)

              dir_name = path.parent.name
              if name != dir_name:
                  print(f"Error: {path} frontmatter 'name' ({name!r}) != directory name ({dir_name!r})", file=sys.stderr)
                  sys.exit(1)

              if not isinstance(description, str) or not description.strip():
                  print(f"Error: {path} frontmatter 'description' must be a non-empty string", file=sys.stderr)
                  sys.exit(1)

              desc_len = len(description)
              if desc_len > 1024:
                  print(f"Error: {path} frontmatter 'description' is {desc_len} chars (max 1024)", file=sys.stderr)
                  sys.exit(1)

              print(f"OK: {path} (name={name}, description_length={desc_len})")
          EOF

      - name: Validate plugin and marketplace JSON
        run: |
          set -euo pipefail
          plugins=".claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json .devin-plugin/plugin.json"
          marketplaces=".claude-plugin/marketplace.json .cursor-plugin/marketplace.json .agents/plugins/marketplace.json"
          jq empty $plugins $marketplaces

          expected_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          for f in $plugins; do
            name="$(jq -r '.name' "$f")"
            version="$(jq -r '.version' "$f")"
            if [ "$name" != "aws-skill-router" ]; then
              echo "Error: $f name is '$name', expected 'aws-skill-router'" >&2
              exit 1
            fi
            if [ "$version" != "$expected_version" ]; then
              echo "Error: $f version is '$version', expected '$expected_version' (from .claude-plugin/plugin.json)" >&2
              exit 1
            fi
          done

          for f in .codex-plugin/plugin.json .cursor-plugin/plugin.json .devin-plugin/plugin.json; do
            skills="$(jq -r '.skills' "$f")"
            if [ "$skills" != "./skills/" ]; then
              echo "Error: $f skills is '$skills', expected './skills/'" >&2
              exit 1
            fi
          done

          for f in .claude-plugin/marketplace.json .cursor-plugin/marketplace.json; do
            source="$(jq -r '.plugins[] | select(.name == "aws-skill-router") | .source' "$f")"
            if [ "$source" != "./" ]; then
              echo "Error: $f plugin source is '$source', expected './'" >&2
              exit 1
            fi
          done

          codex_path="$(jq -r '.plugins[] | select(.name == "aws-skill-router") | .source.path' .agents/plugins/marketplace.json)"
          if [ "$codex_path" != "./" ]; then
            echo "Error: .agents/plugins/marketplace.json plugin path is '$codex_path', expected './'" >&2
            exit 1
          fi

          echo "OK: plugin and marketplace JSON files valid (version $expected_version)"

      - name: Ensure AWS CLI >= 2.35.0
        run: |
          check_aws_version() {
            if ! command -v aws >/dev/null 2>&1; then
              return 1
            fi
            local ver_out ver major minor
            ver_out="$(aws --version 2>&1 || true)"
            ver="$(printf '%s\n' "$ver_out" | awk '{for(i=1;i<=NF;i++) if($i ~ /^aws-cli\//){sub(/^aws-cli\//,"",$i); print $i; exit}}')"
            if [ -z "$ver" ]; then
              return 1
            fi
            IFS='.' read -r major minor _ <<< "$ver"
            case "$major" in ''|*[!0-9]*) return 1 ;; esac
            case "$minor" in ''|*[!0-9]*) return 1 ;; esac
            major=$((10#$major))
            minor=$((10#$minor))
            [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -ge 35 ]; }
          }

          if command -v aws >/dev/null 2>&1; then
            aws --version
          else
            echo "aws CLI not installed"
          fi

          if ! check_aws_version; then
            echo "Installing/upgrading AWS CLI v2..."
            curl -sSfL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
            rm -rf /tmp/aws /tmp/awscliv2.zip
          fi

          aws --version
          if ! check_aws_version; then
            echo "Error: AWS CLI version is still below 2.35.0" >&2
            exit 1
          fi

      - name: Check router skill names against live catalog
        run: scripts/check-skill-names.sh
